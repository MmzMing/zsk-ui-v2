server {
    listen 80;
    listen 8082;
    server_name 192.168.101.129;

    root /www/sites/192.168.101.129/index/dist;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/192.168.101.129/log/access.log main;
    error_log  /www/sites/192.168.101.129/log/error.log;

    # SSL 证书验证
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 前端路由（单页应用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → zsk-api
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # OSS 反向代理 → zsk-oss (MinIO)
    location /oss/ {
        proxy_pass http://192.168.101.129:9000/;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 上传文件大小限制
    client_max_body_size 500M;

    # 代理超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 引入额外代理配置
    include /www/sites/192.168.101.129/proxy/*.conf;
}
